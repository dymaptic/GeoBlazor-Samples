<svg xmlns="http://www.w3.org/2000/svg" width="18" height="16" viewBox="0 0 7 6">
    <!-- Polygon outline (bridge-like quad) -->
    <polygon points="0.6,1.5 4.8,0.5 6.4,4.2 2.0,5.5"
             fill="none" stroke="#E76439" stroke-width="0.5" />
    <!-- Vertex handles -->
    <circle cx="0.6" cy="1.5" r="0.6" fill="#E76439" />
    <circle cx="4.8" cy="0.5" r="0.6" fill="#E76439" />
    <circle cx="6.4" cy="4.2" r="0.6" fill="#E76439" />
    <circle cx="2.0" cy="5.5" r="0.6" fill="#E76439" />
    <!-- 4-way move arrow centered in polygon -->
    <g transform="translate(3.5 3)">
        <line x1="-0.9" y1="0" x2="0.9" y2="0" stroke="#E76439" stroke-width="0.5" />
        <line x1="0" y1="-0.9" x2="0" y2="0.9" stroke="#E76439" stroke-width="0.5" />
        <polygon points="-1.7,0 -0.75,-0.65 -0.75,0.65" fill="#E76439" />
        <polygon points="1.7,0 0.75,-0.65 0.75,0.65" fill="#E76439" />
        <polygon points="0,-1.7 -0.65,-0.75 0.65,-0.75" fill="#E76439" />
        <polygon points="0,1.7 -0.65,0.75 0.65,0.75" fill="#E76439" />
    </g>
</svg>
