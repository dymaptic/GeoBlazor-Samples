<svg xmlns="http://www.w3.org/2000/svg" width="18" height="16" viewBox="0 0 7 6">
    <defs>
        <mask id="featureTableMask">
            <rect width="7" height="6" fill="gold" />
            <!-- Table outer border -->
            <rect x="0.5" y="0.5" width="6" height="5" fill="none" stroke="black" stroke-width="0.2" />
            <!-- Header row separator (thicker for hierarchy) -->
            <line x1="0.5" y1="1.7" x2="6.5" y2="1.7" stroke="black" stroke-width="0.25" />
            <!-- Inner row separators -->
            <line x1="0.5" y1="2.85" x2="6.5" y2="2.85" stroke="black" stroke-width="0.12" />
            <line x1="0.5" y1="4.0" x2="6.5" y2="4.0" stroke="black" stroke-width="0.12" />
            <!-- Inner column separators -->
            <line x1="2.5" y1="0.5" x2="2.5" y2="5.5" stroke="black" stroke-width="0.12" />
            <line x1="4.5" y1="0.5" x2="4.5" y2="5.5" stroke="black" stroke-width="0.12" />
        </mask>
    </defs>

    <!-- Apply the mask to the colored rectangle -->
    <g mask="url(#featureTableMask)">
        <rect x="0" y="0" width="7" height="6" fill="#E76439"/>
    </g>
</svg>
